name: Plan0 Ai
description: >-
  Plan0 AI is a real estate construction technology company that applies AI to
  preconstruction cost estimation and design analysis. Its platform turns
  architectural drawings into detailed cost estimates and 3D models in roughly
  30 minutes rather than the traditional two-week cycle, and adds automated
  takeoff and pricing, value-engineering scenario simulation, and predictive
  analytics. Plan0 AI serves real estate developers underwriting and making
  preconstruction design decisions, general contractors producing business-
  development estimates and cost forecasts, and investors validating pro-formas
  and benchmarking. Surfaced as a Y Combinator portfolio company and added to
  the API Evangelist network. As of this enrichment pass the company publishes a
  marketing and demo-booking website only, with no public API, developer
  documentation, SDKs, or machine-readable API surface.
